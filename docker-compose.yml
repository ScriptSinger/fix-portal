services:
    nginx:
        image: nginx:1.25-alpine
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

        depends_on:
            - php
        networks:
            - laravel
            - ufamasters_laravel
        labels:
            - "traefik.enable=true"
            # Основной HTTPS-роутер (без www)
            - "traefik.http.routers.laravel.rule=Host(`ufamasters.ru`)"
            - "traefik.http.routers.laravel.entrypoints=websecure"
            - "traefik.http.routers.laravel.tls.certresolver=myresolver"

            # www — только постоянное перенаправление на основное зеркало
            - "traefik.http.routers.laravel-www.rule=Host(`www.ufamasters.ru`)"
            - "traefik.http.routers.laravel-www.entrypoints=websecure"
            - "traefik.http.routers.laravel-www.tls.certresolver=myresolver"
            - "traefik.http.routers.laravel-www.middlewares=redirect-www"
            - "traefik.http.middlewares.redirect-www.redirectregex.regex=^https?://www\\.ufamasters\\.ru/(.*)"
            - "traefik.http.middlewares.redirect-www.redirectregex.replacement=https://ufamasters.ru/$$1"
            - "traefik.http.middlewares.redirect-www.redirectregex.permanent=true"

              # HTTP → HTTPS редирект
            - "traefik.http.routers.laravel-insecure.rule=Host(`ufamasters.ru`,`www.ufamasters.ru`)"
            - "traefik.http.routers.laravel-insecure.entrypoints=web"
            - "traefik.http.routers.laravel-insecure.middlewares=redirect-to-https"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    php:
        build:
            context: .
            dockerfile: docker/php/php.dockerfile
        restart: unless-stopped
        user: "${UID}:${GID}"
        volumes:
            - ./:/var/www/html
        networks:
            - laravel
    composer:
        build:
            context: .
            dockerfile: docker/composer/composer.dockerfile
        user: "${UID}:${GID}"
        volumes:
            - ./:/var/www/html
        working_dir: /var/www/html

    mysql:
        image: mysql:8.0.38-debian
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
        volumes:
            - db_data:/var/lib/mysql
            - ./docker/mysql/binlog.cnf:/etc/mysql/conf.d/binlog.cnf:ro
        networks:
            - laravel

networks:
    laravel:
    ufamasters_laravel:
        external: true

volumes:
    db_data:
