services:
    traefik:
        image: traefik:v2.11
        container_name: traefik
        restart: unless-stopped
        command:
            - "--api.dashboard=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
            - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
            - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
            - "--certificatesresolvers.myresolver.acme.email=admin@ufamasters.ru"
            - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./letsencrypt:/letsencrypt
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - laravel

    php:
        build:
            context: .
            dockerfile: docker/php/php.dockerfile
        restart: unless-stopped
        user: "${UID}:${GID}" # Для запуска контейнера от текущего пользователя хоста
        volumes:
            - ./:/var/www/html
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

        networks:
            - laravel
    composer:
        build:
            context: .
            dockerfile: docker/composer/composer.dockerfile

        user: "${UID}:${GID}"
        volumes:
            - ./:/var/www/html
        working_dir: /var/www/html

    nginx:
        image: nginx:1.25-alpine
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

        depends_on:
            - php
        networks:
            - laravel
        labels:
            - "traefik.enable=true"
            # HTTPS роутер
            - "traefik.http.routers.laravel.rule=Host(`ufamasters.ru`,`www.ufamasters.ru`)"
            - "traefik.http.routers.laravel.entrypoints=websecure"
            - "traefik.http.routers.laravel.tls.certresolver=myresolver"

              # HTTP → HTTPS редирект
            - "traefik.http.routers.laravel-insecure.rule=Host(`ufamasters.ru`,`www.ufamasters.ru`)"
            - "traefik.http.routers.laravel-insecure.entrypoints=web"
            - "traefik.http.routers.laravel-insecure.middlewares=redirect-to-https"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    mysql:
        image: mysql:8.0.38-debian
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
        volumes:
            - db_data:/var/lib/mysql
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - laravel

networks:
    laravel:

volumes:
    db_data:
