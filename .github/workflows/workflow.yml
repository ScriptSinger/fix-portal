name: Deploy to Production

on:
  push:
    branches:
      - main
      - ci-test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

            # обновление env
            cat > ~/ufamasters/.env <<EOL
          ${{ secrets.ENV_FILE }}
          EOL

            cd ~/ufamasters

            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd

            export COMPOSE_FILE=docker-compose.prod.yml

            docker compose pull
            docker compose build --pull --no-cache
            docker compose up -d --force-recreate

            docker compose run --rm php composer install --no-dev --prefer-dist --optimize-autoloader
            docker compose run --rm php php artisan migrate --force
            docker compose run --rm php php artisan optimize

            docker system prune -af --volumes
          EOF
