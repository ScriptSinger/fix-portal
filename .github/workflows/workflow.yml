name: Deploy to Production

on:
  push:
    branches:
      - main
      - ci-test

jobs:
  build-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo, bcmath
          tools: composer:v2

      - name: Install composer dependencies (no-dev)
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      # Без этого кэша MoonShine при каждом запросе перебирает все классы vendor
      # и падает на классах с отсутствующими dev-зависимостями (Carbon\PHPStan).
      # Кэш содержит только имена классов, поэтому его можно собрать в CI.
      - name: Cache MoonShine types
        run: php artisan moonshine:optimize

      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Node Dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Build frontend
        run: |
          if [ -f package.json ]; then
            npm run prod
          fi

      - name: Create artifact
        run: |
          tar -czf release.tar.gz \
            app \
            bootstrap \
            config \
            database \
            docker \
            lang \
            public \
            resources \
            routes \
            vendor \
           .env.example \
            artisan \
            composer.json \
            composer.lock \
            docker-compose.yml \
            package-lock.json \
            package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          mkdir release && tar -xzf release.tar.gz -C release
          SSH="ssh -i ~/.ssh/id_ed25519"
          TARGET=${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:ufamasters/

          # кэш провайдеров от прошлых версий должен исчезнуть до копирования
          $SSH ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'rm -f ~/ufamasters/bootstrap/cache/*.php'

          # код и vendor: передаём только изменившиеся файлы, удалённое в репозитории
          # (старые контроллеры, пакеты вроде Passport) удаляем и на сервере
          rsync -rlptzc --delete -e "$SSH" \
            release/app release/config release/database release/lang \
            release/resources release/routes release/vendor "$TARGET"

          # без --delete: в public лежат symlink storage и sitemap.xml, созданные на сервере
          rsync -rlptzc -e "$SSH" \
            release/public release/bootstrap release/docker release/artisan \
            release/composer.json release/composer.lock release/docker-compose.yml \
            release/package.json release/package-lock.json release/.env.example "$TARGET"

          $SSH ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF

            cd ~/ufamasters

            echo "${{ secrets.ENV_FILE }}" > .env

            docker compose down
            docker compose up -d --build
            # Ждём MySQL: переменные должны раскрываться внутри контейнера, поэтому \$
            for i in {1..30}; do
              if docker compose exec -T mysql sh -c 'mysqladmin ping -h localhost -u"\$MYSQL_USER" -p"\$MYSQL_PASSWORD" --silent'; then
                break
              fi
              sleep 2
            done
            docker compose run --rm php php artisan migrate --force
            docker compose run --rm php php artisan route:clear
            docker compose run --rm php php artisan view:clear
            docker compose run --rm php php artisan optimize
            docker compose run --rm php php artisan moonshine:optimize
            docker compose run --rm php php artisan sitemap:generate
          EOF
