name: Deploy to Production

on:
  push:
    branches:
      - main
      - ci-test

jobs:
  build-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo, bcmath
          tools: composer:v2

      - name: Install composer dependencies (no-dev)
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Build frontend
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run prod
          fi

      - name: Laravel cache
        run: |
          php artisan config:cache || true
          php artisan route:cache || true
          php artisan view:cache || true

      - name: Create artifact
        run: |
          tar -czf release.tar.gz \
            app \
            bootstrap \
            config \
            database \
            docker \
            lang\
            public \
            resources \
            routes \
            storage \
           .env.example \
            artisan \
            composer.json \
            composer.lock \
            docker-compose.yml \
            package-lock.json \
            package.json \

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          scp -i ~/.ssh/id_ed25519 release.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/release.tar.gz

          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF

            cd ~/ufamasters

            tar -xzf /tmp/release.tar.gz -C ~/ufamasters

            echo "${{ secrets.ENV_FILE }}" > .env

            docker compose down
            docker system prune -af
            docker compose up -d --build
            docker compose run --rm composer composer install --no-dev --prefer-dist --optimize-autoloader
            docker compose run --rm php php artisan migrate --force
            docker compose run --rm php php artisan route:clear
            docker compose run --rm php php artisan view:clear
            docker compose run --rm php php artisan optimize
          EOF
