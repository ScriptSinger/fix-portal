server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Старые профили пользователей удалены: отвечаем 410 без запуска PHP и запросов в БД.
    # ^~ отключает проверку регулярных выражений, а слэш не задевает /users-images
    location = /users { return 410; }
    location ^~ /users/ { return 410; }

    # Сканеры ищут забытые секреты (.env, ключи облаков, конфиги): отвечаем 404 сразу в nginx,
    # без запуска PHP и запросов в БД. /.well-known не трогаем (проверка домена Let's Encrypt)
    location ~* ^/(\.(env|git|svn|aws|ssh|docker|npmrc|htpasswd|config|ds_store)|(id_rsa|credentials|secrets|wp-config)([./_]|$)|(service-account|gcp|google|firebase)[-_.][^/]*|(sa|key|keys)\.json$) {
        return 404;
    }

    # Сканеры ищут WordPress, phpMyAdmin и веб-шеллы: у нас их нет, отвечаем 404 сразу в nginx,
    # без запуска PHP и запросов в БД
    location ~* ^/(wp-(admin|content|includes|login|json|config|cron|trackback)|xmlrpc|phpmyadmin|pma|cgi-bin|vendor/phpunit)(/|\.|$) {
        return 404;
    }

    # Отдача статических файлов (с кэшем)
    location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Обслуживание статического контента
    location / {
        limit_req zone=one burst=10 nodelay;  # ограничение скорости запросов
        limit_req zone=search burst=3 nodelay;
        limit_req zone=crawler burst=10;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Любой другой *.php (admin.php, cache.php и т.п.) в FPM не отправляем
    location ~ \.php$ {
        return 404;
    }

    # Проксирование PHP-запросов в PHP-FPM: выполняем только front controller
    location = /index.php {
        include fastcgi.conf;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # Защита конфигурационных файлов
    location ~ /\.ht {
        deny all;
    }
}
