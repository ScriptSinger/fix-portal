user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Перед nginx стоит traefik: без этого $remote_addr у всех посетителей один (адрес traefik)
    # и лимиты ниже считаются на весь сайт сразу, а не на посетителя
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=one:10m rate=5r/s;

    # Поиск по прошивкам тяжёлый (секунды на запрос): не больше 10 поисков в минуту с одного адреса.
    # Пустой ключ nginx не считает, поэтому запросы без ?search= лимит не затрагивает
    map $arg_search $search_key {
        ""      "";
        default $binary_remote_addr;
    }
    limit_req_zone $search_key zone=search:10m rate=10r/m;

    # Краулеры (ИИ и SEO-сканеры) делят между собой одну очередь: 30 запросов в минуту на всех.
    # Яндекс и Google сюда не входят
    map $http_user_agent $crawler_key {
        default "";
        ~*(ClaudeBot|GPTBot|meta-externalagent|Amazonbot|Bytespider|PetalBot|DotBot|AhrefsBot|SemrushBot|MJ12bot|Applebot) crawler;
    }
    limit_req_zone $crawler_key zone=crawler:1m rate=30r/m;

    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
